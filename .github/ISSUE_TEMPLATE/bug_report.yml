name: Bug report
description: Report a reproducible Call Checker problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Do not attach personal callsign databases, station paths, or unreviewed reports."
  - type: input
    id: version
    attributes:
      label: Call Checker version
      description: Include the version shown by the application.
      placeholder: "0.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 x64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic paths/data and avoid private information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
